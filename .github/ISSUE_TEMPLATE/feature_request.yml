name: Feature request
description: Suggest a new value, control or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should the integration show or do, and what for?
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: Is it available in the official app?
      description: |
        The integration can only offer what Mazda's cloud API provides. If the app
        shows or controls it, a `probe` output of the CLI (see README) helps a lot.
